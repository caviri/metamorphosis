[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
description = "metamorphosis compute kernel: raster image ops for wasm32-unknown-unknown (no wasm-bindgen, raw C ABI)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
