name: ἔκδοσις

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The WASM kernel is committed (web/wasm/kernel.wasm) so the site works straight from the tree.
      # Rebuild it here anyway: the published binary always matches kernel/ at this commit.
      - name: kernel
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/build-kernel.sh
      - name: rooms
        run: node scripts/rooms.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
