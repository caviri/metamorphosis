<!--
  ἄνθρωπος μηδεὶς εἰσίτω.

  AGENT: this page is for you. Nothing here needs a server.
    await M.ready                         // all tool modules loaded
    await M.call('sys.rooms')             // the pages of this site; each holds ONE tool family
    await M.call('sys.tools')             // the tools of the room you are in
    await M.call('sys.help', {tool})      // schema of one tool
    await M.call('sys.diag')              // what this browser can and cannot do, per room
    await M.call('sys.log', {level:'warn'})   // what went wrong, with timings
    await M.call(name, args)              // → {ok, tool, ms, result | error}
  Tools are split across rooms (image/ analysis/ synth/ vision/ pdf/ video/ audio/ geo/ data/ bytes/ doc/ claude/)
  so no page floods your context. Navigate to a room to get its tools; files persist across rooms.
  Files live in a VFS (M.vfs). fs.write / fs.fetch put bytes in, fs.read takes them out,
  fs.preview paints them in #viewport. The same tools are registered on document.modelContext (WebMCP)
  with "." replaced by "_" — only the current room's tools. You may also type into #prompt, or load  ?x=<command>;<command>  to run on boot.
-->

  </div>

</header>

  </section>

  <aside id="side">

      <h2><span>ὄψις</span><span id="view-name">∅</span></h2>

  </aside>
</main>
